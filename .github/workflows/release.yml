name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: releases-main
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.2

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/tests.yml

  prepare:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.metadata.outputs.should_release }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      release_mode: ${{ steps.metadata.outputs.release_mode }}
      matrix: ${{ steps.metadata.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - id: metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run release:prepare

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build ${{ matrix.target }}
      - name: Package archive
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          folder="dist/balint-dc-bot-v${VERSION}-${TARGET}"
          if [[ "$TARGET" == windows-* ]]; then
            archive="balint-dc-bot-v${VERSION}-${TARGET}.zip"
            (cd "$folder" && zip -rq "../../$archive" .)
          else
            archive="balint-dc-bot-v${VERSION}-${TARGET}.tar.gz"
            tar -czf "$archive" -C "$folder" .
          fi
          mkdir -p artifacts
          mv "$archive" artifacts/
      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          path: release-assets
          merge-multiple: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Publish draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          bun run release:publish
